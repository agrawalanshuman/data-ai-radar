services:
  radar:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      RADAR_MODE: "${RADAR_MODE:-local}"
      RADAR_OLLAMA_URL: "${RADAR_OLLAMA_URL:-http://host.docker.internal:11434}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - radar-data:/data
volumes:
  radar-data:
