[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "data-ai-radar"
version = "0.1.0"
description = "Personalized, source-linked technology briefings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
  "streamlit>=1.67,<2",
  "pydantic>=2.12,<3",
  "httpx>=0.28,<0.29",
  "feedparser>=6.0.12,<7",
  "python-dotenv>=1.2,<2",
  "charset-normalizer>=3.4,<4",
  "tzdata>=2025.2",
]

[project.scripts]
data-ai-radar = "radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.16"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
